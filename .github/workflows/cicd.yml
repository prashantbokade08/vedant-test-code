name: Vedant Test Todo App CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  NODE_VERSION: "22"
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "047646727557"
  EKS_CLUSTER_NAME: vedant-test-eks
  ECR_REGISTRY: 047646727557.dkr.ecr.ap-south-1.amazonaws.com
  BACKEND_ECR_REPOSITORY: vedant-todo-backend
  FRONTEND_ECR_REPOSITORY: vedant-todo-frontend
  K8S_NAMESPACE: vedant-todo

jobs:
  sast:
    name: SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: |
            p/javascript
            p/typescript
            p/security-audit

  backend-sca:
    name: Backend SCA
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

  frontend-sca:
    name: Frontend SCA
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest

    if: github.event_name == 'pull_request'

    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@v4

  backend:
    name: Backend Validation
    runs-on: ubuntu-latest

    needs:
      - sast
      - backend-sca

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate server
        run: node --check server.js

  frontend:
    name: Frontend Validation
    runs-on: ubuntu-latest

    needs:
      - sast
      - frontend-sca

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: todo-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: todo-frontend:${{ github.sha }}
          build-args: |
            VITE_API_BASE=
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: todo-backend:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: todo-frontend:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest

    needs:
      - container-scan

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_ECR_REPOSITORY }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_ECR_REPOSITORY }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_ECR_REPOSITORY }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_ECR_REPOSITORY }}:latest
          build-args: |
            VITE_API_BASE=
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest

    needs:
      - build-and-push

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Configure EKS
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"

      - name: Verify EKS
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Verify namespace
        run: |
          kubectl get namespace "${K8S_NAMESPACE}"

      - name: Update backend deployment
        run: |
          kubectl set image \
            deployment/todo-backend \
            backend="${ECR_REGISTRY}/${BACKEND_ECR_REPOSITORY}:${GITHUB_SHA}" \
            --namespace="${K8S_NAMESPACE}"

      - name: Update frontend deployment
        run: |
          kubectl set image \
            deployment/todo-frontend \
            frontend="${ECR_REGISTRY}/${FRONTEND_ECR_REPOSITORY}:${GITHUB_SHA}" \
            --namespace="${K8S_NAMESPACE}"

      - name: Wait for backend rollout
        run: |
          kubectl rollout status \
            deployment/todo-backend \
            --namespace="${K8S_NAMESPACE}" \
            --timeout=5m

      - name: Wait for frontend rollout
        run: |
          kubectl rollout status \
            deployment/todo-frontend \
            --namespace="${K8S_NAMESPACE}" \
            --timeout=5m

      - name: Verify pods
        run: |
          kubectl get pods \
            --namespace="${K8S_NAMESPACE}" \
            --output=wide

      - name: Verify deployments
        run: |
          kubectl get deployments \
            --namespace="${K8S_NAMESPACE}"

      - name: Verify services
        run: |
          kubectl get services \
            --namespace="${K8S_NAMESPACE}"

      - name: Verify HPA
        run: |
          kubectl get hpa \
            --namespace="${K8S_NAMESPACE}"

      - name: Verify ingress
        run: |
          kubectl get ingress \
            --namespace="${K8S_NAMESPACE}"

      - name: Backend health check
        run: |
          kubectl delete pod ci-health-check \
            --namespace="${K8S_NAMESPACE}" \
            --ignore-not-found=true

          kubectl run ci-health-check \
            --restart=Never \
            --image=curlimages/curl \
            --namespace="${K8S_NAMESPACE}" \
            --command \
            -- curl \
              --fail \
              --silent \
              --show-error \
              --max-time 10 \
              http://todo-backend:5000/health

          if kubectl wait \
            --for=jsonpath='{.status.phase}'=Succeeded \
            pod/ci-health-check \
            --namespace="${K8S_NAMESPACE}" \
            --timeout=60s; then

            kubectl logs \
              pod/ci-health-check \
              --namespace="${K8S_NAMESPACE}"

            kubectl delete pod ci-health-check \
              --namespace="${K8S_NAMESPACE}" \
              --ignore-not-found=true

          else

            kubectl describe pod ci-health-check \
              --namespace="${K8S_NAMESPACE}"

            kubectl logs \
              pod/ci-health-check \
              --namespace="${K8S_NAMESPACE}" \
              --ignore-errors=true

            kubectl delete pod ci-health-check \
              --namespace="${K8S_NAMESPACE}" \
              --ignore-not-found=true

            exit 1
          fi

      - name: Deployment summary
        run: |
          echo "Deployment completed successfully"
          echo "Commit: ${GITHUB_SHA}"
          echo "AWS Region: ${AWS_REGION}"
          echo "EKS Cluster: ${EKS_CLUSTER_NAME}"
          echo "Namespace: ${K8S_NAMESPACE}"
          echo "Backend Image: ${ECR_REGISTRY}/${BACKEND_ECR_REPOSITORY}:${GITHUB_SHA}"
          echo "Frontend Image: ${ECR_REGISTRY}/${FRONTEND_ECR_REPOSITORY}:${GITHUB_SHA}"