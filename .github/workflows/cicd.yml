name: Vedant Todo - CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  NODE_VERSION: "22"

  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: vedant-test-eks

  ECR_REGISTRY: 047646727557.dkr.ecr.ap-south-1.amazonaws.com
  BACKEND_ECR_REPOSITORY: vedant-todo-backend
  FRONTEND_ECR_REPOSITORY: vedant-todo-frontend

  K8S_NAMESPACE: vedant-todo

# ---------------------------------------------------------------------------
# SAST - Static Application Security Testing
# ---------------------------------------------------------------------------

jobs:

  sast:
    name: SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: |
            p/javascript
            p/typescript
            p/security-audit


  # -------------------------------------------------------------------------
  # Backend dependency security scan
  # -------------------------------------------------------------------------

  backend-sca:
    name: Backend Dependency Scan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm security audit
        run: npm audit --audit-level=high


  # -------------------------------------------------------------------------
  # Frontend dependency security scan
  # -------------------------------------------------------------------------

  frontend-sca:
    name: Frontend Dependency Scan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm security audit
        run: npm audit --audit-level=high


  # -------------------------------------------------------------------------
  # Dependency review for pull requests
  # -------------------------------------------------------------------------

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest

    if: github.event_name == 'pull_request'

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4


  # -------------------------------------------------------------------------
  # Backend validation
  # -------------------------------------------------------------------------

  backend:
    name: Backend Validation
    runs-on: ubuntu-latest

    needs:
      - sast
      - backend-sca

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Node.js syntax
        run: node --check server.js


  # -------------------------------------------------------------------------
  # Frontend validation and production build
  # -------------------------------------------------------------------------

  frontend:
    name: Frontend Validation
    runs-on: ubuntu-latest

    needs:
      - sast
      - frontend-sca

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build


  # -------------------------------------------------------------------------
  # Build Docker images and scan them with Trivy
  # -------------------------------------------------------------------------

  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: todo-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: todo-frontend:${{ github.sha }}
          build-args: |
            VITE_API_BASE=
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: todo-backend:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: todo-frontend:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1


  # -------------------------------------------------------------------------
  # Build and push images to Amazon ECR
  # -------------------------------------------------------------------------

  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest

    needs:
      - container-scan

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # GitHub OIDC -> AWS IAM Role
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          allowed-account-ids: "047646727557"

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------------------------------------------------------------
      # Backend
      # ---------------------------------------------------------------------

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_ECR_REPOSITORY }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_ECR_REPOSITORY }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # ---------------------------------------------------------------------
      # Frontend
      # ---------------------------------------------------------------------

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_ECR_REPOSITORY }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_ECR_REPOSITORY }}:latest
          build-args: |
            VITE_API_BASE=
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend


  # -------------------------------------------------------------------------
  # Deploy to Amazon EKS
  # -------------------------------------------------------------------------

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest

    needs:
      - build-and-push

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # GitHub OIDC -> AWS IAM Role
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          allowed-account-ids: "047646727557"

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # ---------------------------------------------------------------------
      # Configure kubectl
      # ---------------------------------------------------------------------

      - name: Configure EKS kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"

      - name: Verify EKS cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      # ---------------------------------------------------------------------
      # Verify Kubernetes namespace
      # ---------------------------------------------------------------------

      - name: Verify Kubernetes namespace
        run: |
          kubectl get namespace "${K8S_NAMESPACE}"

      # ---------------------------------------------------------------------
      # Deploy backend
      # ---------------------------------------------------------------------

      - name: Update backend image
        run: |
          kubectl set image \
            deployment/todo-backend \
            backend="${ECR_REGISTRY}/${BACKEND_ECR_REPOSITORY}:${GITHUB_SHA}" \
            --namespace="${K8S_NAMESPACE}"

      # ---------------------------------------------------------------------
      # Deploy frontend
      # ---------------------------------------------------------------------

      - name: Update frontend image
        run: |
          kubectl set image \
            deployment/todo-frontend \
            frontend="${ECR_REGISTRY}/${FRONTEND_ECR_REPOSITORY}:${GITHUB_SHA}" \
            --namespace="${K8S_NAMESPACE}"

      # ---------------------------------------------------------------------
      # Wait for backend rollout
      # ---------------------------------------------------------------------

      - name: Wait for backend rollout
        run: |
          kubectl rollout status \
            deployment/todo-backend \
            --namespace="${K8S_NAMESPACE}" \
            --timeout=5m

      # ---------------------------------------------------------------------
      # Wait for frontend rollout
      # ---------------------------------------------------------------------

      - name: Wait for frontend rollout
        run: |
          kubectl rollout status \
            deployment/todo-frontend \
            --namespace="${K8S_NAMESPACE}" \
            --timeout=5m

      # ---------------------------------------------------------------------
      # Kubernetes verification
      # ---------------------------------------------------------------------

      - name: Verify pods
        run: |
          kubectl get pods \
            --namespace="${K8S_NAMESPACE}" \
            --output=wide

      - name: Verify deployments
        run: |
          kubectl get deployments \
            --namespace="${K8S_NAMESPACE}"

      - name: Verify services
        run: |
          kubectl get services \
            --namespace="${K8S_NAMESPACE}"

      - name: Verify HPA
        run: |
          kubectl get hpa \
            --namespace="${K8S_NAMESPACE}"

      - name: Verify ingress
        run: |
          kubectl get ingress \
            --namespace="${K8S_NAMESPACE}"

      # ---------------------------------------------------------------------
      # Backend health check
      # ---------------------------------------------------------------------

      - name: Backend health check
        run: |
          kubectl run ci-health-check \
            --rm \
            --restart=Never \
            --image=curlimages/curl \
            --namespace="${K8S_NAMESPACE}" \
            -- \
            curl \
              --fail \
              --silent \
              --show-error \
              --max-time 10 \
              http://todo-backend:5000/health

      # ---------------------------------------------------------------------
      # Deployment summary
      # ---------------------------------------------------------------------

      - name: Deployment summary
        run: |
          echo "=============================================="
          echo "Vedant Todo deployment completed successfully"
          echo "=============================================="
          echo "Commit:       ${GITHUB_SHA}"
          echo "AWS Region:   ${AWS_REGION}"
          echo "EKS Cluster:  ${EKS_CLUSTER_NAME}"
          echo "Namespace:     ${K8S_NAMESPACE}"
          echo ""
          echo "Backend:"
          echo "${ECR_REGISTRY}/${BACKEND_ECR_REPOSITORY}:${GITHUB_SHA}"
          echo ""
          echo "Frontend:"
          echo "${ECR_REGISTRY}/${FRONTEND_ECR_REPOSITORY}:${GITHUB_SHA}"
          echo "=============================================="