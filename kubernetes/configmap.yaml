apiVersion: v1
kind: ConfigMap

metadata:
  name: vedant-todo-config
  namespace: vedant-todo

data:
  NODE_ENV: "production"
  PORT: "5000"
  RATE_LIMIT_MAX: "100"

  # Temporary setting for testing without a DNS name.
  # Change this to the frontend ALB URL when you want
  # to restrict CORS.
  CORS_ORIGINS: "*"