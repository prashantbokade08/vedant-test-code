apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: todo-backend-pdb
  namespace: vedant-todo

spec:
  minAvailable: 1

  selector:
    matchLabels:
      app: todo-backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: todo-frontend-pdb
  namespace: vedant-todo

spec:
  minAvailable: 1

  selector:
    matchLabels:
      app: todo-frontend